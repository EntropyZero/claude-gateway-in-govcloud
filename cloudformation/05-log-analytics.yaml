AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Optional ALB access-log search for the Claude apps gateway: an Athena
  workgroup (CMK-encrypted results, per-query scan cutoff) plus a Glue
  database and table over the gateway ALB's access-log bucket, using
  partition projection on the log delivery date so no partition maintenance
  is ever needed. Serverless and idle-free: the only recurring cost is
  per-query data scanned. Deploy any time after 02-gateway.yaml via
  scripts/deploy-log-analytics.sh (which passes the ALB logs bucket name from
  the gateway stack's outputs); independent of 03/04. Query how-to:
  docs/operations/om-runbooks.md section 14.

Parameters:
  NamePrefix:
    Type: String
    Default: claude-gw
    Description: Must match the NamePrefix used by 01/02 (cross-stack imports).
    AllowedPattern: '[a-z][a-z0-9-]{1,20}'

  AlbLogsBucketName:
    Type: String
    Description: >-
      Name of the ALB access-logs bucket (the gateway stack's
      AlbLogsBucketName output) - deploy-log-analytics.sh fills this in.
      Passed as a parameter rather than imported so 02's output stays
      unlocked (cross-stack exports cannot change while imported).
    AllowedPattern: '[a-z0-9.-]{3,63}'

  AlbLogsProjectionStart:
    Type: String
    Default: '2025/01/01'
    Description: >-
      First date (yyyy/MM/dd, UTC) the partition projection enumerates.
      Earlier than the first delivered log object is harmless (empty
      partitions scan nothing); later HIDES older logs from every query.
      There is no reason to tune this: logs expire from the bucket per
      02's AlbLogRetentionDays anyway.
    AllowedPattern: '[0-9]{4}/[0-9]{2}/[0-9]{2}'

  AthenaResultsRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: >-
      Days to keep Athena query results (CSV copies of whatever the queries
      returned - log excerpts, so treated with the same sensitivity as the
      logs) in the results bucket before expiry.

  AthenaScanCutoffBytes:
    Type: Number
    Default: 10737418240
    MinValue: 10000000
    Description: >-
      Per-query data-scanned cutoff enforced by the workgroup, in bytes
      (default 10 GiB - far above any day-scoped query over this gateway's
      gzipped logs; Athena bills per byte scanned). A query that exceeds it
      is cancelled. Minimum 10000000 (10 MB, Athena's floor for the setting).

Resources:
  # Query results are CSV excerpts of the access logs, so this bucket gets
  # the full house posture the logs bucket itself cannot have (ELB delivery
  # forces SSE-S3 there): CMK encryption, all public access blocked, and a
  # short expiry - results are derived scratch data, re-creatable by
  # re-running the query.
  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID:
                Fn::ImportValue: !Sub '${NamePrefix}-kms-key-arn'
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-athena-results
            Status: Enabled
            ExpirationInDays: !Ref AthenaResultsRetentionDays

  # Same TLS-only deny the other sensitive CMK buckets carry (03 archive
  # buckets, 04 artifacts) - results are log excerpts.
  AthenaResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AthenaResultsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AthenaResultsBucket.Arn
              - !Sub '${AthenaResultsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # EnforceWorkGroupConfiguration makes the results location + encryption
  # non-overridable per query: anything run through this workgroup lands
  # CMK-encrypted in the bucket above, regardless of client settings.
  # RecursiveDeleteOption lets a teardown delete the workgroup even though
  # it has accumulated query history (the named queries/history are
  # metadata; the result objects live in the bucket, which is Retain'd).
  AlbLogsWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${NamePrefix}-alb-logs'
      Description: >-
        ALB access-log search for the Claude gateway. Results are
        CMK-encrypted; per-query scan cutoff enforced.
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: !Ref AthenaScanCutoffBytes
        ResultConfiguration:
          OutputLocation: !Sub 's3://${AthenaResultsBucket}/results/'
          EncryptionConfiguration:
            EncryptionOption: SSE_KMS
            KmsKey:
              Fn::ImportValue: !Sub '${NamePrefix}-kms-key-arn'

  # Glue identifiers use underscores: hyphenated names would need quoting in
  # every SQL statement, so the database name is the NamePrefix with
  # hyphens folded to underscores (claude-gw -> claude_gw_logs).
  # GovCloud caveat (operator-facing, in om-runbooks section 14): Athena/Glue
  # METADATA - database/table names, query strings - is not permitted to
  # contain export-controlled data.
  LogsDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Join ['_', !Split ['-', !Sub '${NamePrefix}-logs']]
        Description: >-
          Log-search tables for the Claude gateway (ALB access logs).

  # The table is the AWS-documented Athena recipe for ALB access logs with
  # partition projection (docs.aws.amazon.com/athena/latest/ug/
  # create-alb-access-logs-table-partition-projection.html), expressed as a
  # Glue table so it is code, not console DDL. Two translation notes:
  #  - input.regex holds the RAW regex: the docs' CREATE TABLE wraps it in a
  #    Hive string literal, so their \\s is \s here. The trailing
  #    " ?( .*)?" catch-all group stays (per the docs note) so future ALB
  #    log-format additions extend lines without breaking the parse;
  #    tests/templates/test_alb_athena_table.py runs this exact regex
  #    against real-format sample lines.
  #  - ${!day} in storage.location.template is CloudFormation's escape for a
  #    literal ${day}, which partition projection substitutes at query time.
  AlbAccessLogsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref LogsDatabase
      TableInput:
        Name: alb_access_logs
        Description: >-
          Gateway ALB access logs (searchable window bounded by the logs
          bucket's expiry, AlbLogRetentionDays in 02). Always filter on the
          day partition key ('yyyy/MM/dd') to bound the scan.
        TableType: EXTERNAL_TABLE
        Parameters:
          EXTERNAL: 'TRUE'
          projection.enabled: 'true'
          projection.day.type: date
          projection.day.range: !Sub '${AlbLogsProjectionStart},NOW'
          projection.day.format: yyyy/MM/dd
          projection.day.interval: '1'
          projection.day.interval.unit: DAYS
          storage.location.template: !Sub 's3://${AlbLogsBucketName}/AWSLogs/${AWS::AccountId}/elasticloadbalancing/${AWS::Region}/${!day}'
        PartitionKeys:
          - Name: day
            Type: string
        StorageDescriptor:
          Location: !Sub 's3://${AlbLogsBucketName}/AWSLogs/${AWS::AccountId}/elasticloadbalancing/${AWS::Region}/'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.RegexSerDe
            Parameters:
              serialization.format: '1'
              input.regex: '([^ ]*) ([^ ]*) ([^ ]*) ([^ ]*):([0-9]*) ([^ ]*)[:-]([0-9]*) ([-.0-9]*) ([-.0-9]*) ([-.0-9]*) (|[-0-9]*) (-|[-0-9]*) ([-0-9]*) ([-0-9]*) "([^ ]*) (.*) (- |[^ ]*)" "([^"]*)" ([A-Z0-9-_]+) ([A-Za-z0-9.-]*) ([^ ]*) "([^"]*)" "([^"]*)" "([^"]*)" ([-.0-9]*) ([^ ]*) "([^"]*)" "([^"]*)" "([^ ]*)" "([^\s]+?)" "([^\s]+)" "([^ ]*)" "([^ ]*)" ?([^ ]*)? ?( .*)?'
          Columns:
            - { Name: type, Type: string }
            - { Name: time, Type: string }
            - { Name: elb, Type: string }
            - { Name: client_ip, Type: string }
            - { Name: client_port, Type: int }
            - { Name: target_ip, Type: string }
            - { Name: target_port, Type: int }
            - { Name: request_processing_time, Type: double }
            - { Name: target_processing_time, Type: double }
            - { Name: response_processing_time, Type: double }
            - { Name: elb_status_code, Type: int }
            - { Name: target_status_code, Type: string }
            - { Name: received_bytes, Type: bigint }
            - { Name: sent_bytes, Type: bigint }
            - { Name: request_verb, Type: string }
            - { Name: request_url, Type: string }
            - { Name: request_proto, Type: string }
            - { Name: user_agent, Type: string }
            - { Name: ssl_cipher, Type: string }
            - { Name: ssl_protocol, Type: string }
            - { Name: target_group_arn, Type: string }
            - { Name: trace_id, Type: string }
            - { Name: domain_name, Type: string }
            - { Name: chosen_cert_arn, Type: string }
            - { Name: matched_rule_priority, Type: string }
            - { Name: request_creation_time, Type: string }
            - { Name: actions_executed, Type: string }
            - { Name: redirect_url, Type: string }
            - { Name: lambda_error_reason, Type: string }
            - { Name: target_port_list, Type: string }
            - { Name: target_status_code_list, Type: string }
            - { Name: classification, Type: string }
            - { Name: classification_reason, Type: string }
            - { Name: conn_trace_id, Type: string }

Outputs:
  AthenaWorkGroupName:
    Description: Run every ALB-log query through this workgroup (it enforces the CMK results location + scan cutoff).
    Value: !Ref AlbLogsWorkGroup
  GlueDatabaseName:
    Description: Athena/Glue database holding the alb_access_logs table.
    Value: !Ref LogsDatabase
  GlueTableName:
    Description: The ALB access-log table (partition key = day, 'yyyy/MM/dd').
    Value: alb_access_logs
  AthenaResultsBucketName:
    Description: CMK-encrypted bucket where query results land (expire per AthenaResultsRetentionDays).
    Value: !Ref AthenaResultsBucket
